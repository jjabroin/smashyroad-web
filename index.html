<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BLOCKY RACER — 복셀 트랙 경주</title>
  <meta name="description" content="복셀 3D 트랙 경주 게임. 차고에서 차를 고르고 3랩 서킷에서 결승선을 노리세요." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <!-- ============ 차고 (차량 선택, 사진 2) ============ -->
  <div id="garage">
    <div class="g-head">
      <div>
        <div id="carName">F1</div>
        <div id="carGrade">전설</div>
      </div>
      <div class="g-stats">
        <div class="srow"><span>🚀 속도</span><div class="stat" id="statSpeed"></div></div>
        <div class="srow"><span>🎛️ 핸들링</span><div class="stat" id="statHandling"></div></div>
        <div class="srow"><span>🛡️ 내구도</span><div class="stat" id="statTough"></div></div>
      </div>
    </div>
    <canvas id="garageCanvas"></canvas>
    <div class="g-foot">
      <button id="carPrev" class="arrow">◀</button>
      <div class="g-mid">
        <div id="carDots">1 / 4</div>
        <button id="raceBtn">🏁 RACE START</button>
      </div>
      <button id="carNext" class="arrow">▶</button>
    </div>
    <p class="g-hint">◀ ▶ 키로 차량 변경 · Enter로 시작 · 3랩 서킷, 4대 경주</p>
  </div>

  <!-- ============ 경주 화면 (사진 1) ============ -->
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="hud" style="display:none">
      <div class="hud-top">
        <canvas id="minimap" width="150" height="150"></canvas>
        <div id="lapBox">LAP<br /><b>1/3</b></div>
        <div class="spacer"></div>
        <div id="posBox">1<small>st/4</small></div>
        <div id="raceTimer">0.0</div>
      </div>
      <div class="hud-speed"><span id="speedBox">0</span><small>km/h</small></div>
      <button id="btnLeft" class="steer left">◀</button>
      <button id="btnRight" class="steer right">▶</button>
      <div class="hud-pedals">
        <button id="btnBrake" class="pedal">▼</button>
        <button id="btnGas" class="pedal gas">▲</button>
      </div>
      <div class="hud-menu">
        <button id="restartBtn" title="재시작">↻</button>
        <button id="garageBtn" title="차고로">🚗</button>
        <button id="muteBtn" title="음소거">🔊</button>
      </div>
      <div id="centerMsg" style="display:none"></div>
      <div id="results" style="display:none">
        <div class="rcard">
          <h2>🏁 RACE RESULTS</h2>
          <div id="resultRows"></div>
          <div class="rbtns">
            <button id="againBtn">다시 달리기 (↻)</button>
            <button id="changeBtn">차 바꾸기 (🚗)</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
  <script>
    // 결과 화면 버튼 (모듈 스코프 밖에서 연결)
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('againBtn').addEventListener('click', () =>
        document.getElementById('restartBtn').click());
      document.getElementById('changeBtn').addEventListener('click', () =>
        document.getElementById('garageBtn').click());
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BLOCKY RACER — 복셀 트랙 경주</title>
  <meta name="description" content="복셀 3D 트랙 경주 게임. 차고에서 차를 고르고 3랩 서킷에서 결승선을 노리세요." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <!-- ============ 차고 (차량 선택, 사진 2) ============ -->
  <div id="garage">
    <div class="g-head">
      <div>
        <div id="carName">F1</div>
        <div id="carGrade">전설</div>
      </div>
      <div class="g-stats">
        <div class="srow"><span>🚀 속도</span><div class="stat" id="statSpeed"></div></div>
        <div class="srow"><span>🎛️ 핸들링</span><div class="stat" id="statHandling"></div></div>
        <div class="srow"><span>🛡️ 내구도</span><div class="stat" id="statTough"></div></div>
      </div>
    </div>
    <canvas id="garageCanvas"></canvas>
    <div class="g-foot">
      <button id="carPrev" class="arrow">◀</button>
      <div class="g-mid">
        <div id="carDots">1 / 8</div>
        <button id="raceBtn">🏁 RACE START</button>
        <button id="onlineBtn">🌐 ONLINE P2P</button>
        <label id="itemToggleWrap"><input type="checkbox" id="itemToggle" checked /> 🎁 아이템전</label>
      </div>
      <button id="carNext" class="arrow">▶</button>
    </div>
    <div class="g-track">
      <button id="trackPrev" class="arrow sm">◀</button>
      <div class="g-tmid">
        <div id="trackName">초원 오벌 · 3LAP</div>
        <canvas id="trackPreview" width="220" height="140"></canvas>
        <div id="trackDots">1 / 3</div>
      </div>
      <button id="trackNext" class="arrow sm">▶</button>
    </div>
    <p class="g-hint">◀ ▶ 키로 차량 변경 · Enter로 시작 · 4대 경주 · 부딪히면 대미지, HP 0이면 폭파!</p>
  </div>

  <!-- ============ 온라인 로비 (P2P) ============ -->
  <div id="onlinePanel" style="display:none">
    <div id="onlineCard">
      <div class="o-head">
        <b>🌐 ONLINE P2P</b>
        <button id="onlineClose">✕</button>
      </div>
      <div id="onlineHome">
        <button id="createBtn" class="obtn">방 만들기</button>
        <div class="ojoin">
          <input id="joinCode" maxlength="4" placeholder="코드 4글자" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go" />
          <button id="joinBtn" class="obtn">참가</button>
        </div>
        <p class="o-hint">같은 코드를 입력한 친구와 직접 연결됩니다 (서버 없음)</p>
      </div>
      <div id="onlineLobby" style="display:none">
        <div class="ocode">CODE <b id="roomCode">----</b></div>
        <div id="lobbyTrack">TRACK: -</div>
        <div id="playerList"></div>
        <div id="lobbyHint" class="o-hint"></div>
        <button id="itemsBtn" class="obtn">🎁 아이템전: ON</button>
        <button id="startOnlineBtn" class="obtn go">🏁 START</button>
        <button id="leaveBtn" class="obtn dim">나가기</button>
      </div>
      <div id="onlineStatus"></div>
    </div>
  </div>

  <!-- ============ 경주 화면 (사진 1) ============ -->
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="hud" style="display:none">
      <div class="hud-top">
        <canvas id="minimap" width="150" height="150"></canvas>
        <div id="lapBox">LAP<br /><b>1/3</b></div>
        <div class="spacer"></div>
        <div id="pingBox" style="display:none">-ms</div>
        <div id="posBox">1<small>st/4</small></div>
        <div id="raceTimer">0.0</div>
      </div>
      <div id="finishBanner" style="display:none">
        <div id="finishTitle">🏁 FINISH</div>
        <div id="finishSub"></div>
        <div class="fb-row">
          <button id="specBtn">👁 관전하기</button>
          <button id="specNextBtn" style="display:none">⏭ 다음 차량</button>
          <button id="specExitBtn" style="display:none">🚗 내 차로</button>
          <button id="finishResultBtn">📋 결과표</button>
        </div>
      </div>
      <div class="hud-speed"><span id="speedBox">0</span><small>km/h</small></div>
      <div id="hpBar"><i id="hpFill"></i></div>
      <button id="btnDrift">DRIFT</button>
      <button id="btnItem">🎁</button>
      <div id="itemBox" style="display:none">-</div>
      <div id="zoneHint" style="display:none">◀ 왼쪽 터치 = 좌회전 · 오른쪽 터치 = 우회전 · 양쪽 동시 = 후진 ▶</div>
      <button id="btnLeft" class="steer left">◀</button>
      <button id="btnRight" class="steer right">▶</button>
      <div class="hud-menu">
        <button id="restartBtn" title="재시작">↻</button>
        <button id="garageBtn" title="차고로">🚗</button>
        <button id="muteBtn" title="음소거">🔊</button>
        <button id="fsBtn" title="전체화면">⛶</button>
      </div>
      <div id="centerMsg" style="display:none"></div>
      <div id="speedVig"></div>
      <div id="results" style="display:none">
        <div class="rcard">
          <div class="rhead"><h2>🏁 RACE RESULTS</h2><button id="resultClose">✕</button></div>
          <div id="resultRows"></div>
          <div class="rbtns">
            <button id="againBtn">다시 달리기 (↻)</button>
            <button id="changeBtn">차 바꾸기 (🚗)</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
  <script>
    // 결과 화면 버튼 (온라인 모드에서 main.js가 오버라이드)
    window.__raceAgain = () => document.getElementById('restartBtn').click();
    window.__raceChange = () => document.getElementById('garageBtn').click();
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('againBtn').addEventListener('click', () => window.__raceAgain());
      document.getElementById('changeBtn').addEventListener('click', () => window.__raceChange());
    });
  </script>
</body>
</html>
